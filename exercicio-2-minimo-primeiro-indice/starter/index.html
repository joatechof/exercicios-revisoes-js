<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 2 — Mínimo e primeira posição</title>
  <style>
    body { max-width: 760px; margin: 0 auto; padding: 2rem; font: 1rem/1.5 system-ui, sans-serif; color: #172033; }
    form { display: grid; gap: .75rem; }
    input, button { padding: .75rem; font: inherit; }
    button { width: fit-content; cursor: pointer; }
    output { display: block; margin-top: 1rem; padding: 1rem; white-space: pre-line; background: #eef3ff; border-radius: .5rem; }
    .error { color: #8a1020; background: #fff0f2; }
  </style>
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Mínimo e primeira posição</h1>
    <p>Escreve números separados por vírgulas. O programa deve encontrar o mínimo e a sua primeira posição.</p>

    <form id="minimumForm" novalidate>
      <label for="numbersInput">Números</label>
      <input id="numbersInput" value="7, -3, 4, -3" autocomplete="off">
      <button type="submit">Encontrar mínimo</button>
    </form>

    <output id="result" aria-live="polite">Ainda não foi efectuada nenhuma pesquisa.</output>
  </main>
</body>
</html>
