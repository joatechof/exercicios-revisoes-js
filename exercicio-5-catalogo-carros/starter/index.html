<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercício 5 — Catálogo de carros</title>
  <style>
    body { max-width: 860px; margin: 0 auto; padding: 2rem; font: 1rem/1.5 system-ui, sans-serif; color: #172033; }
    button { padding: .75rem; font: inherit; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1rem; margin-top: 1rem; }
    article { padding: 1rem; background: #f4f6fa; border-radius: .5rem; }
    output { display: block; white-space: pre-line; overflow-wrap: anywhere; }
    .error { color: #8a1020; background: #fff0f2; }
  </style>
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Catálogo de carros</h1>
    <p>Aplica um aumento, filtra os resultados e responde a duas perguntas booleanas sem alterar os dados originais.</p>
    <button id="analyseButton" type="button">Analisar catálogo</button>

    <div class="grid">
      <article>
        <h2>Original</h2>
        <output id="originalOutput">Por executar.</output>
      </article>
      <article>
        <h2>Após aumento</h2>
        <output id="increasedOutput">Por executar.</output>
      </article>
      <article>
        <h2>Até 6000 €</h2>
        <output id="affordableOutput">Por executar.</output>
      </article>
      <article>
        <h2>Respostas</h2>
        <output id="questionsOutput" aria-live="polite">Por executar.</output>
      </article>
    </div>
  </main>
</body>
</html>
